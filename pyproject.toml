[project]
name = "metis-bo"
version = "0.2.0"
description = "METIS active-learning workflow as a package with pluggable surrogates and acquisitions, plus a benchmark harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.11.*"
# Exact pins: the seeded regression test (tests/test_regression_legacy.py) is only
# meaningful inside this environment. uv.lock pins every transitive dependency.
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "xgboost==2.1.4",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "xlrd==2.0.1",
    "pyyaml==6.0.2",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
# tabpfn 2.0.x uses the public (ungated) TabPFN-v2 regressor weights on HuggingFace.
tabpfn = ["tabpfn==2.0.9", "torch==2.7.1"]
# TabPFN-3.5 (open weights, non-commercial licence) for the paper-style replay
# experiments. Mutually exclusive with `tabpfn` (v2), which the main benchmark uses.
tabpfn35 = ["tabpfn==9.2.0", "torch==2.7.1"]
# Pick exactly one PyTorch build with the TabPFN extra:
#   cpu   - any machine (the default for CPU-only workers)
#   cu126 - NVIDIA GPUs up to the RTX 40 series (driver >= 528)
#   cu128 - NVIDIA RTX 50 series (Blackwell; driver >= 570)
# e.g. `uv sync --extra tabpfn --extra cu126`
cpu = ["torch==2.7.1"]
cu126 = ["torch==2.7.1"]
cu128 = ["torch==2.7.1"]

[dependency-groups]
dev = ["pytest==8.3.5", "nbformat==5.10.4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metis", "metis_bench"]

[tool.uv]
default-groups = ["dev"]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" }],
    [{ extra = "tabpfn" }, { extra = "tabpfn35" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "tabpfn: needs the optional TabPFN install and its weights",
]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
