# Step 11 / family F4: the tuned schedule vs the v1 schedule, both on top of the Phase 2
# winners, on the TEST split and the real oracles.
name: phase3_schedule
reference: winners_legacy_schedule
families:
  F4: {reference: winners_legacy_schedule, arms: [tuned_schedule]}
base_arm: {from_winners: artifacts/winners.json}
arms:
  - {name: winners_legacy_schedule, schedule: {type: legacy}}
  - {name: tuned_schedule, from_tuning: artifacts/tuning/schedule.json}
  - {name: incumbent_check, init: {type: random}, surrogate: {type: xgb_ensemble}, selector: {type: topk}, use_noise: false, schedule: {type: legacy}}
problems:
  suite: suite/suite.json
  split: test
  dims: [12, 27]
  real: [borkowski, pure_pool]
  noise: [realistic]
settings: {batch_size: 32, n_rounds: 10, pool_size: 10000, test_points: 1000}
seeds: [0, 50]
pilot:
  seeds: [0, 4]
  settings: {pool_size: 2000, test_points: 300}
  problems: {limit_per_subtype: 1, dims: [12], real: [borkowski]}
  arm_overrides: {xgb_ensemble: {n_iter: 15, ensemble_len: 10}, gp_matern: {n_restarts: 0}, tabpfn: {n_estimators: 4}}
