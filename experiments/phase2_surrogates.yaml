# Step 9 / family F2: surrogate. Report predictive accuracy and interval calibration
# per round (rounds.csv, surrogate_quality.png) next to final regret.
name: phase2_surrogates
reference: incumbent
families:
  F2: {reference: incumbent, arms: [surr_gp, surr_tabpfn]}
problems:
  suite: suite/suite.json
  split: test
  dims: [12, 27]
  real: [borkowski, pure_pool]
  noise: [realistic]
settings: {batch_size: 32, n_rounds: 10, pool_size: 10000, test_points: 1000}
seeds: [0, 20]   # amendment 3: 20 paired seeds (was 50)
arms:
  - {name: incumbent}
  - {name: surr_gp, surrogate: {type: gp_matern, nu: 2.5, n_restarts: 2}}
  # device: auto uses a CUDA GPU when one is present (install with --extra cu126 or cu128),
  # otherwise the CPU. Run this arm alone on a GPU machine with `--arms surr_tabpfn`.
  # Schedule: TabPFN's own, tuned on the replay data (experiments/tuned/tabpfn_schedule.json,
  # amendment 4); the incumbent and the GP keep the v1 schedule.
  - {name: surr_tabpfn, surrogate: {type: tabpfn, version: v3.5, n_estimators: 8, device: auto}}   # amendment 5: TabPFN-3.5
# TabPFN on CPU costs about 4 minutes per round single-threaded (320 training recipes,
# 2,300 predictions, 4 estimators). The full study should run it with device: cuda.
pilot:
  seeds: [0, 2]
  settings: {pool_size: 1000, test_points: 200}
  problems: {limit_per_subtype: 1, dims: [12], real: [borkowski]}
  arm_overrides: {xgb_ensemble: {n_iter: 15, ensemble_len: 10}, gp_matern: {n_restarts: 0}, tabpfn: {n_estimators: 1}}
