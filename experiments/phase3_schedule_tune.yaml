# Step 11: tune the exploration schedule on the DEV split, on top of the Phase 2 winners
# (artifacts/winners.json from `python -m metis_bench decide`). Tuning seeds 1000-1019 are
# disjoint from the confirmatory seeds. Winner -> artifacts/tuning/schedule.json.
name: phase3_schedule_tune
tuning: {part: schedule, output: artifacts/tuning/schedule.json}
base_arm: {from_winners: artifacts/winners.json}
candidates:
  - {type: legacy}
  - {type: constant, beta: [0.25, 0.5, 1.0, 1.41, 2.0, 3.0]}
  - {type: linear, start: [1.41, 2.0, 3.0], end: [0.1, 0.25, 0.5]}
  - {type: exponential, start: [1.41, 2.0, 3.0], end: [0.1, 0.25, 0.5]}
  - {type: gp_ucb, scale: [0.1, 0.2, 0.3, 0.5]}
  - {type: adaptive, start: [1.0, 1.41, 2.0], down: [0.5, 0.7], up: [1.4, 2.0]}
problems:
  suite: suite/suite.json
  split: dev
  dims: [12, 27]
  noise: [realistic]
settings: {batch_size: 32, n_rounds: 10, pool_size: 10000, test_points: 1000}
seeds: [1000, 1020]
pilot:
  seeds: [1000, 1002]
  settings: {pool_size: 2000, test_points: 300}
  problems: {limit_per_subtype: 1, dims: [12]}
  arm_overrides: {xgb_ensemble: {n_iter: 15, ensemble_len: 10}, gp_matern: {n_restarts: 0}, tabpfn: {n_estimators: 4}}
  candidates:
    - {type: legacy}
    - {type: constant, beta: [1.0]}
    - {type: linear, start: [2.0], end: [0.25]}
    - {type: exponential, start: [2.0], end: [0.25]}
    - {type: gp_ucb, scale: [0.2]}
    - {type: adaptive, start: [1.41]}
